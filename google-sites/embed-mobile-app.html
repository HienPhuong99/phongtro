<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Quản lý phòng trọ — Giao diện Di động (Mobile PWA)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0F172A;
      font-family: 'Be Vietnam Pro', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .phongtro-mobile-frame {
      width: 100%;
      height: 100vh;
      min-height: 760px;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe
    class="phongtro-mobile-frame"
    src="https://hienphuong99.github.io/phongtro/?mode=mobile"
    allow="geolocation; camera; clipboard-write"
    allowfullscreen
  ></iframe>
</body>
</html>
